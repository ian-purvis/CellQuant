[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellquant"
version = "0.4.0a2"
description = "Napari Cellpose segmentation and per-object multichannel quantification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "BSD-3-Clause"
dependencies = [
  "numpy==2.0.2", "pandas==3.0.5", "tifffile==2026.3.3", "nd2==0.11.3",
  "PyYAML==6.0.3", "openpyxl==3.1.5",
  "napari[pyqt6]==0.9.0", "magicgui==0.10.2",
  "scipy==1.17.1", "matplotlib==3.11.0", "pillow==12.3.0",
  "psutil==7.2.2", "dask[array]==2026.8.0",
]

[project.optional-dependencies]
cellpose-v4 = ["cellpose==4.2.1.1"]
cellpose-v3 = ["cellpose>=3.1.0,<4"]
test = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[project.scripts]
cellquant = "cellquant.cli:main"

[project.entry-points."napari.manifest"]
cellquant = "cellquant:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellquant = ["napari.yaml", "sample_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
