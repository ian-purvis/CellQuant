name: Bug report
description: Something in CellQuant does not work or looks wrong
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 14 (Apple Silicon), Ubuntu 22.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install CellQuant?
      options:
        - Install CellQuant.bat / .command / .sh
        - By hand (pip or conda)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CellQuant version
      placeholder: "2.1.0"
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Microscope, file type, channels, Z slices, pixel size. A real example helps most.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Paste any error text or the end of cellquant_developer.log.
    validations:
      required: true
